<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<title>בור-צלף</title>
<style>
  body { margin: 0; background: #1a2014; color: #e7efd4; font-family: "Segoe UI", Arial, sans-serif; }
  header { display: flex; justify-content: space-between; gap: 12px; padding: 8px 16px; font-size: 15px; letter-spacing: 0.04em; }
  #stage { position: relative; width: 900px; margin: 0 auto; }
  canvas { display: block; cursor: crosshair; border: 2px solid #3e4a2c; }
  #pick { position: absolute; inset: 0; display: none; place-items: center; background: rgba(8, 12, 6, 0.78); }
  #pick.on { display: grid; }
  #pick div { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; width: 560px; }
  button { background: #24301a; color: #e7efd4; border: 1px solid #8ea36a; padding: 10px 12px; font-size: 16px; cursor: pointer; }
  #rifles { width: 900px; margin: 8px auto 0; display: flex; flex-wrap: wrap; gap: 6px; }
  #rifles button { font-size: 13px; }
  #rifles button.on { outline: 2px solid #d6e2a8; }
</style>
</head>
<body>
<header>
  <span id="hud"></span>
  <span id="gun"></span>
</header>
<div id="stage">
  <canvas id="c" width="900" height="520"></canvas>
  <div id="pick"><div id="skills"></div></div>
</div>
<div id="rifles"></div>
<script>
"use strict";
var canvas = document.getElementById("c");
var ctx = canvas.getContext("2d");
var hud = document.getElementById("hud");
var gun = document.getElementById("gun");
var pick = document.getElementById("pick");
var skillBox = document.getElementById("skills");
var rifleBox = document.getElementById("rifles");
var rifles = [
  { name: "צופי קל", color: "#d6c15a", sway: 5, zoom: 1, damage: 1, cycle: 180, spread: 1.5, kick: 3, pierce: 1, scare: 0, hit: 9, voice: "crack", shape: "carbine", pro: "צרור מהיר", con: "כדור קטן" },
  { name: "כבד", color: "#c45a3a", sway: 13, zoom: 1, damage: 4, cycle: 980, spread: 1.15, kick: 26, hit: 18, pierce: 1, scare: 50, voice: "boom", shape: "heavy", pro: "בועט ומפיל", con: "הכוונת קופצת" },
  { name: "בריח מהיר", color: "#6ec8b8", sway: 7, zoom: 1.4, damage: 2, cycle: 210, spread: 0.85, kick: 9, hit: 11, pierce: 1, scare: 0, voice: "snap", shape: "bolt", pro: "בריח קצר", con: "רתע מצטבר" },
  { name: "רועש", color: "#e0a15a", sway: 10, zoom: 1, damage: 3, cycle: 640, spread: 1, kick: 14, hit: 13, pierce: 1, scare: 190, voice: "blast", shape: "loud", pro: "מפזר את השדה", con: "כולם זזים" },
  { name: "שקט", color: "#b7d4c8", sway: 6, zoom: 1.3, damage: 2, cycle: 460, spread: 0.45, kick: 1, hit: 10, pierce: 1, scare: 0, voice: "hush", shape: "can", pro: "בלי בעיטה", con: "נזק בינוני" },
  { name: "זום ארוך", color: "#c46ad4", sway: 8, zoom: 2.8, damage: 2, cycle: 720, spread: 0.28, kick: 6, hit: 7, pierce: 1, scare: 0, scope: true, voice: "ping", shape: "scope", pro: "עיגול צר ומדויק", con: "קשה לתפוס תנועה" },
  { name: "זום קצר", color: "#6aa0e8", sway: 8, zoom: 0.7, damage: 2, cycle: 390, spread: 1.7, kick: 5, hit: 24, pierce: 1, scare: 0, voice: "pop", shape: "bull", pro: "חרוט רחב", con: "בלי הגדלה" },
  { name: "נזק גבוה", color: "#e07a4a", sway: 12, zoom: 1.8, damage: 5, cycle: 1180, spread: 0.7, kick: 18, hit: 12, pierce: 2, scare: 0, voice: "cannon", shape: "amr", pro: "חודר שניים", con: "המתנה ארוכה" },
  { name: "יציב", color: "#9dce78", sway: 2, zoom: 1.4, damage: 2, cycle: 520, spread: 0.3, kick: 0, hit: 12, pierce: 1, scare: 0, voice: "tick", shape: "match", pro: "כמעט בלי תנודה", con: "קצב רגיל" },
  { name: "בריח איטי", color: "#8a6ad4", sway: 5, zoom: 2.2, damage: 4, cycle: 1400, spread: 0.25, kick: 4, hit: 14, pierce: 1, scare: 0, scope: true, voice: "deep", shape: "long", pro: "ירייה ראשונה נקייה", con: "בריח ארוך" }
];
var labels = [
  ["vision", "ראייה"],
  ["breath", "שליטה בנשימה"],
  ["stamina", "סטמינה"],
  ["cycle", "קצב בריח"],
  ["spot", "זיהוי מסיחים"]
];
var skills = { vision: 0, breath: 0, stamina: 0, cycle: 0, spot: 0 };
var saved = localStorage.getItem("burrow-sniper");
if (saved) {
  try {
    var parsed = JSON.parse(saved);
    labels.forEach(function (pair) {
      var n = parsed[pair[0]];
      if (typeof n === "number") skills[pair[0]] = Math.max(0, Math.min(10, n));
    });
  } catch (err) { /* keep zeros */ }
}
var rifle = rifles[0];
var rifleIndex = 0;
var mouse = { x: 450, y: 220 };
var breathHeld = false;
var breath = 1;
var cool = 0;
var hits = 0;
var score = 0;
var stage = 1;
var clock = 50;
var choosing = false;
var note = "";
var noteT = 0;
var kickX = 0;
var kickY = 0;
var crawlers = [];
var stills = [];
var burrows = [];
var flashes = [];
var tracers = [];
var audioCtx = null;
var zones = [
  { id: "kandahar", title: "קנדהאר" },
  { id: "normandy", title: "נורמנדי" },
  { id: "pearl", title: "פרל הרבור" },
  { id: "stalingrad", title: "סטלינגרד" }
];
var last = performance.now();
var origin = { x: 450, y: 478 };

function saveSkills() {
  localStorage.setItem("burrow-sniper", JSON.stringify(skills));
}
function breathMax() {
  return 1.6 + skills.stamina * 0.28;
}
function swayNow() {
  var base = rifle.sway * (1 - skills.breath * 0.06);
  if (breathHeld && breath > 0) base *= 0.12;
  else base *= 1 + (1 - breath) * 0.35;
  return base * rifle.spread;
}
function waitMs() {
  return Math.max(90, rifle.cycle * (1 - skills.cycle * 0.065));
}
function seeRange() {
  return 160 + skills.vision * 32;
}

function layoutBurrows() {
  burrows = [];
  stills = [];
  crawlers = [];
  for (var i = 0; i < 6; i++) {
    burrows.push({
      x: 70 + (i % 3) * 250 + Math.random() * 80,
      y: 70 + Math.floor(i / 3) * 150 + Math.random() * 40,
      t: 0.3 + Math.random() * 1.6
    });
  }
  for (var s = 0; s < 4; s++) {
    stills.push({
      x: 120 + s * 180 + Math.random() * 40,
      y: 120 + (s % 2) * 90,
      decoy: s % 2 === 1,
      alive: true
    });
  }
}
layoutBurrows();

function spawn(b) {
  crawlers.push({
    x: b.x,
    y: b.y,
    a: Math.random() * Math.PI * 2,
    v: 18 + Math.random() * 16 + stage,
    decoy: Math.random() < 0.34,
    turn: 0.5 + Math.random() * 1.2,
    scare: 0,
    alive: true
  });
}

function soldier(x, y, scale, decoy, marked) {
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(scale, scale);
  ctx.fillStyle = decoy ? "#6e6248" : "#2c3324";
  ctx.fillRect(-7, -4, 16, 8);
  ctx.beginPath();
  ctx.arc(0, -8, 5, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = "#1a1e14";
  ctx.fillRect(4, -2, 14, 2);
  ctx.fillStyle = decoy ? "#8a7a52" : "#3d4a2e";
  ctx.fillRect(-9, 2, 10, 4);
  if (marked) {
    ctx.strokeStyle = "#e6d36a";
    ctx.lineWidth = 2;
    ctx.strokeRect(-12, -16, 28, 26);
  }
  ctx.restore();
}

function targetsAlive() {
  var list = [];
  crawlers.forEach(function (c) { if (c.alive) list.push(c); });
  stills.forEach(function (c) { if (c.alive) list.push(c); });
  return list;
}

function zoneNow() {
  return zones[Math.floor((stage - 1) / 3) % zones.length];
}
function audio() {
  var Ctx = window.AudioContext || window.webkitAudioContext;
  if (!Ctx) return null;
  if (!audioCtx) audioCtx = new Ctx();
  if (audioCtx.state === "suspended") audioCtx.resume();
  return audioCtx;
}
function bang() {
  var actx = audio();
  if (!actx) return;
  var now = actx.currentTime;
  var voice = rifle.voice;
  var osc = actx.createOscillator();
  var gain = actx.createGain();
  var freq = 240;
  var dur = 0.12;
  var peak = 0.18;
  osc.type = "sawtooth";
  if (voice === "crack") { freq = 1680; dur = 0.05; peak = 0.12; osc.type = "square"; }
  else if (voice === "boom") { freq = 70; dur = 0.34; peak = 0.28; osc.type = "sine"; }
  else if (voice === "snap") { freq = 980; dur = 0.04; peak = 0.14; osc.type = "square"; }
  else if (voice === "blast") { freq = 180; dur = 0.28; peak = 0.26; osc.type = "sawtooth"; }
  else if (voice === "hush") { freq = 420; dur = 0.06; peak = 0.04; osc.type = "sine"; }
  else if (voice === "ping") { freq = 2200; dur = 0.09; peak = 0.1; osc.type = "sine"; }
  else if (voice === "pop") { freq = 360; dur = 0.07; peak = 0.16; osc.type = "triangle"; }
  else if (voice === "cannon") { freq = 55; dur = 0.42; peak = 0.3; osc.type = "sine"; }
  else if (voice === "tick") { freq = 1400; dur = 0.03; peak = 0.08; osc.type = "square"; }
  else if (voice === "deep") { freq = 130; dur = 0.22; peak = 0.2; osc.type = "triangle"; }
  osc.frequency.setValueAtTime(freq, now);
  osc.frequency.exponentialRampToValueAtTime(Math.max(40, freq * 0.45), now + dur);
  gain.gain.setValueAtTime(peak, now);
  gain.gain.exponentialRampToValueAtTime(0.001, now + dur);
  osc.connect(gain);
  gain.connect(actx.destination);
  osc.start(now);
  osc.stop(now + dur + 0.02);
}
function fire() {
  if (choosing || cool > 0) return;
  cool = waitMs();
  bang();
  var s = swayNow();
  var aim = {
    x: mouse.x + (Math.random() - 0.5) * s * 2 + kickX,
    y: mouse.y + (Math.random() - 0.5) * s * 2 + kickY
  };
  kickX = (Math.random() - 0.5) * rifle.kick;
  kickY = -Math.abs(rifle.kick) * 0.45;
  flashes.push({ x: origin.x, y: origin.y - 24, t: 0.08, r: 6 + rifle.kick * 0.4 });
  tracers.push({ x: origin.x, y: origin.y - 20, x2: aim.x, y2: aim.y, t: 0.12, w: 1 + rifle.damage * 0.4 });
  if (rifle.scare) {
    crawlers.forEach(function (c) {
      if (!c.alive) return;
      if (Math.hypot(c.x - aim.x, c.y - aim.y) < rifle.scare) {
        c.scare = 1.5;
        c.a += (Math.random() - 0.5) * 2.2;
      }
    });
  }
  var dx = aim.x - origin.x;
  var dy = aim.y - origin.y;
  var len = Math.hypot(dx, dy) || 1;
  var ux = dx / len;
  var uy = dy / len;
  var pool = targetsAlive().map(function (c) {
    var t = (c.x - origin.x) * ux + (c.y - origin.y) * uy;
    var px = origin.x + ux * t;
    var py = origin.y + uy * t;
    return { c: c, t: t, d: Math.hypot(c.x - px, c.y - py) };
  }).filter(function (row) {
    return row.t > 0 && row.d < rifle.hit;
  }).sort(function (a, b) { return a.t - b.t; });
  var used = 0;
  if (!pool.length) {
    note = "החטאה";
    noteT = 0.7;
    return;
  }
  pool.forEach(function (row) {
    if (used >= rifle.pierce) return;
    used += 1;
    row.c.alive = false;
    if (row.c.decoy) {
      score = Math.max(0, score - 5);
      note = "מסיח";
    } else {
      hits += 1;
      score += 10 * rifle.damage + Math.ceil(clock);
      note = "הריגה +" + (10 * rifle.damage);
      if (hits >= 8) openPick();
    }
  });
  noteT = 0.85;
  crawlers = crawlers.filter(function (c) { return c.alive; });
}

function openPick() {
  if (choosing) return;
  choosing = true;
  pick.className = "on";
  skillBox.innerHTML = "";
  var title = document.createElement("div");
  title.textContent = "הריגות " + hits + "   ניקוד " + score + "   בחרי יכולת אחת";
  title.style.width = "100%";
  title.style.textAlign = "center";
  skillBox.appendChild(title);
  labels.forEach(function (pair) {
    var btn = document.createElement("button");
    btn.textContent = pair[1] + " " + skills[pair[0]] + "/10";
    btn.onclick = function () {
      if (skills[pair[0]] < 10) skills[pair[0]] += 1;
      saveSkills();
      hits = 0;
      stage += 1;
      clock = Math.max(28, 50 - stage * 2);
      breath = breathMax();
      choosing = false;
      pick.className = "";
      layoutBurrows();
      paintGuns();
    };
    skillBox.appendChild(btn);
  });
}

function paintGuns() {
  rifleBox.innerHTML = "";
  rifles.forEach(function (item, idx) {
    var btn = document.createElement("button");
    btn.textContent = item.name;
    btn.style.borderColor = item.color;
    if (idx === rifleIndex) btn.className = "on";
    btn.onclick = function () { selectRifle(idx); };
    rifleBox.appendChild(btn);
  });
}
function selectRifle(idx) {
  rifleIndex = idx;
  rifle = rifles[idx];
  kickX = 0;
  kickY = 0;
  paintGuns();
}
paintGuns();

canvas.addEventListener("mousemove", function (e) {
  var r = canvas.getBoundingClientRect();
  var sense = rifle.scope ? 0.72 : 1;
  mouse.x = (e.clientX - r.left) * canvas.width / r.width * sense + (rifle.scope ? 450 * (1 - sense) : 0);
  mouse.y = (e.clientY - r.top) * canvas.height / r.height * sense + (rifle.scope ? 240 * (1 - sense) : 0);
});
canvas.addEventListener("mousedown", function () { fire(); });
window.addEventListener("keydown", function (e) {
  if (e.code === "Space") {
    breathHeld = true;
    e.preventDefault();
  }
  if (e.code === "Digit0") selectRifle(9);
  else if (e.code.indexOf("Digit") === 0) {
    var n = Number(e.code.slice(5));
    if (n >= 1 && n <= 9) selectRifle(n - 1);
  }
});
window.addEventListener("keyup", function (e) {
  if (e.code === "Space") breathHeld = false;
});

function frame(now) {
  var dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  cool = Math.max(0, cool - dt * 1000);
  kickX *= 0.9;
  kickY *= 0.9;
  noteT = Math.max(0, noteT - dt);
  var drain = breathHeld ? 0.45 / (1 + skills.stamina * 0.12) : -0.35;
  breath = Math.max(0, Math.min(breathMax(), breath - drain * dt));
  if (!choosing) {
    clock -= dt;
    if (clock <= 0) openPick();
    burrows.forEach(function (b) {
      b.t -= dt;
      if (b.t <= 0) {
        spawn(b);
        b.t = 2.4 + Math.random() * 3.2;
      }
    });
    crawlers.forEach(function (c) {
      c.turn -= dt;
      if (c.turn <= 0) {
        c.a += (Math.random() - 0.5) * 1.5;
        c.turn = 0.45 + Math.random() * 1.5;
      }
      var speed = c.v * (c.scare > 0 ? 2.2 : 1);
      c.scare = Math.max(0, c.scare - dt);
      c.x += Math.cos(c.a) * speed * dt;
      c.y += Math.sin(c.a) * speed * dt;
      if (c.x < 20 || c.x > 880) c.a = Math.PI - c.a;
      if (c.y < 24 || c.y > 430) c.a = -c.a;
    });
  }
  draw();
  requestAnimationFrame(frame);
}

function drawZone(place) {
  var sky = ctx.createLinearGradient(0, 0, 0, 240);
  var ground = ctx.createLinearGradient(0, 200, 0, 520);
  if (place.id === "kandahar") {
    sky.addColorStop(0, "#d7b07a");
    sky.addColorStop(1, "#f0ddb4");
    ground.addColorStop(0, "#c4a36a");
    ground.addColorStop(1, "#8a6a3e");
  } else if (place.id === "normandy") {
    sky.addColorStop(0, "#8ea4b4");
    sky.addColorStop(1, "#c5d0c4");
    ground.addColorStop(0, "#6d8a58");
    ground.addColorStop(1, "#4e6240");
  } else if (place.id === "pearl") {
    sky.addColorStop(0, "#f2c9a0");
    sky.addColorStop(1, "#6eb0d4");
    ground.addColorStop(0, "#3e8eae");
    ground.addColorStop(1, "#1d4e68");
  } else {
    sky.addColorStop(0, "#d5dde4");
    sky.addColorStop(1, "#eef2f4");
    ground.addColorStop(0, "#e7eef2");
    ground.addColorStop(1, "#b7c4cc");
  }
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, 900, 230);
  ctx.fillStyle = ground;
  ctx.fillRect(0, 210, 900, 310);
  if (place.id === "kandahar") {
    ctx.fillStyle = "#b8894e";
    ctx.beginPath();
    ctx.moveTo(0, 200); ctx.lineTo(140, 150); ctx.lineTo(280, 190); ctx.lineTo(460, 140); ctx.lineTo(700, 180); ctx.lineTo(900, 150); ctx.lineTo(900, 230); ctx.lineTo(0, 230);
    ctx.fill();
    ctx.fillStyle = "#a36b45";
    ctx.fillRect(80, 250, 90, 46);
    ctx.fillRect(620, 270, 120, 40);
    ctx.fillStyle = "#6b4630";
    ctx.fillRect(108, 262, 16, 22);
  } else if (place.id === "normandy") {
    ctx.fillStyle = "#3f6a3a";
    for (var h = 0; h < 5; h++) ctx.fillRect(40 + h * 180, 230, 28, 90);
    ctx.fillStyle = "#d9d2bc";
    ctx.fillRect(0, 400, 900, 40);
    ctx.strokeStyle = "rgba(255,255,255,0.35)";
    for (var r = 0; r < 18; r++) {
      ctx.beginPath();
      ctx.moveTo(20 + r * 50, 0);
      ctx.lineTo(8 + r * 50, 80);
      ctx.stroke();
    }
  } else if (place.id === "pearl") {
    ctx.fillStyle = "#2c3d4a";
    ctx.fillRect(40, 250, 160, 28);
    ctx.fillRect(520, 240, 220, 34);
    ctx.fillStyle = "#1b2830";
    ctx.fillRect(70, 230, 18, 22);
    ctx.fillRect(600, 214, 22, 28);
    ctx.fillStyle = "#2f6b38";
    ctx.beginPath();
    ctx.moveTo(780, 300); ctx.lineTo(800, 210); ctx.lineTo(820, 300);
    ctx.fill();
  } else {
    ctx.fillStyle = "#8d98a1";
    ctx.fillRect(70, 230, 70, 80);
    ctx.fillRect(160, 250, 40, 60);
    ctx.fillRect(640, 220, 90, 100);
    ctx.fillStyle = "#5c6770";
    ctx.fillRect(82, 248, 12, 16);
    ctx.fillRect(662, 240, 14, 18);
  }
  ctx.fillStyle = place.id === "stalingrad" ? "#9aa7b0" : "#2a261c";
  for (var i = 0; i < 14; i++) {
    ctx.fillRect(20 + i * 64, 448, 48, 16);
    ctx.fillRect(40 + i * 64, 462, 48, 14);
  }
  ctx.fillStyle = "rgba(20,16,10,0.55)";
  ctx.fillRect(300, 8, 300, 32);
  ctx.fillStyle = "#f4ecd4";
  ctx.font = "20px Segoe UI";
  ctx.textAlign = "center";
  ctx.fillText(place.title, 450, 30);
}
function drawGun() {
  var x = origin.x;
  var y = origin.y;
  ctx.fillStyle = "#1b2414";
  ctx.fillRect(x - 16, y - 8, 32, 18);
  ctx.fillStyle = "#c8b48a";
  ctx.beginPath();
  ctx.arc(x - 6, y - 10, 6, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = rifle.color;
  var shape = rifle.shape;
  if (shape === "carbine") {
    ctx.fillRect(x + 2, y - 18, 28, 4);
    ctx.fillRect(x + 8, y - 24, 8, 6);
  } else if (shape === "heavy") {
    ctx.fillRect(x, y - 16, 40, 8);
    ctx.fillRect(x + 28, y - 22, 10, 6);
  } else if (shape === "bolt") {
    ctx.fillRect(x + 2, y - 20, 36, 3);
    ctx.fillRect(x + 16, y - 24, 6, 4);
  } else if (shape === "loud") {
    ctx.fillRect(x, y - 18, 34, 7);
    ctx.beginPath();
    ctx.arc(x + 36, y - 14, 6, 0, Math.PI * 2);
    ctx.fill();
  } else if (shape === "can") {
    ctx.fillRect(x + 2, y - 18, 30, 3);
    ctx.fillRect(x + 28, y - 21, 14, 8);
  } else if (shape === "scope") {
    ctx.fillRect(x + 2, y - 20, 42, 3);
    ctx.strokeStyle = rifle.color;
    ctx.lineWidth = 2;
    ctx.strokeRect(x + 14, y - 30, 16, 8);
  } else if (shape === "bull") {
    ctx.fillRect(x + 4, y - 16, 18, 6);
  } else if (shape === "amr") {
    ctx.fillRect(x - 4, y - 18, 52, 6);
    ctx.fillRect(x + 8, y - 24, 10, 6);
  } else if (shape === "match") {
    ctx.fillRect(x + 2, y - 19, 34, 3);
    ctx.fillRect(x + 20, y - 16, 4, 8);
  } else {
    ctx.fillRect(x + 2, y - 20, 48, 3);
    ctx.fillRect(x + 36, y - 26, 8, 6);
  }
}

function draw() {
  drawZone(zoneNow());
  var range = seeRange();
  ctx.fillStyle = "rgba(10, 14, 8, 0.45)";
  ctx.fillRect(0, 0, 900, 520);
  ctx.globalCompositeOperation = "destination-out";
  var fog = ctx.createRadialGradient(origin.x, origin.y - 40, 40, origin.x, origin.y - 40, range);
  fog.addColorStop(0, "rgba(0,0,0,1)");
  fog.addColorStop(1, "rgba(0,0,0,0)");
  ctx.fillStyle = fog;
  ctx.beginPath();
  ctx.arc(origin.x, origin.y - 40, range, 0, Math.PI * 2);
  ctx.fill();
  ctx.globalCompositeOperation = "source-over";
  burrows.forEach(function (b) {
    if (Math.hypot(b.x - origin.x, b.y - origin.y) > range + 20) return;
    ctx.fillStyle = "#2a2116";
    ctx.beginPath();
    ctx.ellipse(b.x, b.y, 18, 9, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = b.t < 0.4 ? "#0c0906" : "#1a140e";
    ctx.beginPath();
    ctx.ellipse(b.x, b.y, 8, 4, 0, 0, Math.PI * 2);
    ctx.fill();
  });
  function paintOne(c, still) {
    var d = Math.hypot(c.x - origin.x, c.y - origin.y);
    if (d > range + 30) return;
    var marked = c.decoy && skills.spot > 0;
    soldier(c.x, c.y, still ? 1.15 : 1, c.decoy, marked);
  }
  stills.forEach(function (c) { if (c.alive) paintOne(c, true); });
  crawlers.forEach(function (c) { if (c.alive) paintOne(c, false); });
  var aimX = mouse.x + kickX;
  var aimY = mouse.y + kickY;
  ctx.strokeStyle = "rgba(214, 226, 168, 0.8)";
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(origin.x, origin.y);
  ctx.lineTo(aimX, aimY);
  ctx.stroke();
  ctx.strokeStyle = rifle.color;
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.arc(aimX, aimY, 6 + rifle.hit * 0.35, 0, Math.PI * 2);
  ctx.stroke();
  ctx.fillStyle = rifle.color;
  ctx.lineWidth = rifle.damage;
  tracers.forEach(function (tr) {
    ctx.globalAlpha = Math.max(0, tr.t * 6);
    ctx.beginPath();
    ctx.moveTo(tr.x, tr.y);
    ctx.lineTo(tr.x2, tr.y2);
    ctx.stroke();
    ctx.globalAlpha = 1;
  });
  tracers = tracers.filter(function (tr) { tr.t -= 0.016; return tr.t > 0; });
  drawGun();
  flashes.forEach(function (f) {
    ctx.fillStyle = "rgba(255, 220, 140, 0.8)";
    ctx.beginPath();
    ctx.arc(f.x, f.y, f.r || 8, 0, Math.PI * 2);
    ctx.fill();
  });
  flashes = flashes.filter(function (f) { f.t -= 0.016; return f.t > 0; });
  if (rifle.scope) {
    ctx.fillStyle = "rgba(6, 8, 6, 0.55)";
    ctx.beginPath();
    ctx.rect(0, 0, 900, 520);
    ctx.arc(aimX, aimY, 90, 0, Math.PI * 2, true);
    ctx.fill();
    ctx.strokeStyle = "rgba(214,226,168,0.7)";
    ctx.strokeRect(aimX - 90, aimY - 90, 180, 180);
  }
  var secs = Math.max(0, Math.ceil(clock));
  var place = zoneNow();
  ctx.fillStyle = "rgba(20,16,10,0.78)";
  ctx.fillRect(280, 8, 340, 34);
  ctx.fillStyle = "#f6edd4";
  ctx.font = "22px Segoe UI";
  ctx.textAlign = "center";
  ctx.fillText(place.title, 450, 32);
  hud.textContent = place.title + "   שעון " + secs + "   הריגות " + hits + "/8   ניקוד " + score + "   שלב " + stage;
  gun.textContent = rifle.name + " · " + rifle.pro + " · " + rifle.con + " · נשימה " + breath.toFixed(1) + " · " + labels.map(function (p) {
    return p[1] + " " + skills[p[0]];
  }).join("  ");
  ctx.fillStyle = secs < 10 ? "#e07a4a" : "#e7efd4";
  ctx.font = "22px Segoe UI";
  ctx.textAlign = "left";
  ctx.fillText(String(secs), 16, 28);
  ctx.fillStyle = "#24301a";
  ctx.fillRect(16, 492, 120, 8);
  ctx.fillStyle = breath > 0.25 ? "#9dce78" : "#e07a4a";
  ctx.fillRect(16, 492, 120 * (breath / breathMax()), 8);
  if (noteT > 0) {
    ctx.fillStyle = "#f4f0d4";
    ctx.font = "26px Segoe UI";
    ctx.textAlign = "center";
    ctx.fillText(note, 450, 36);
  }
}
requestAnimationFrame(frame);
</script>
</body>
</html>
