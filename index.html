  kickY *= Math.max(0.35, 0.94 - skills.stamina * 0.055);

      if (!c.alive) return;
      c.y += c.vy * dt;
      c.x += Math.sin(c.y / 18) * 12 * dt;
      if (c.y > 250) {
        c.alive = false;
        crawlers.push({
          x: c.x, y: c.y, a: Math.random() * Math.PI * 2,
          v: 16 + Math.random() * 14, decoy: false,

  stills.forEach(function (c) { if (c.alive) paintOne(c, true); });
  crawlers.forEach(function (c) { if (c.alive) paintOne(c, false); });
  var aimX = mouse.x + kickX;
  var aimY = mouse.y + kickY;
  var land = landOf({ x: aimX, y: aimY });
  ctx.save();
  ctx.setLineDash([5, 7]);
  ctx.strokeStyle = rifle.blast ? "rgba(196, 84, 36, 0.7)" : "rgba(244, 236, 210, 0.45)";
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.arc(origin.x, origin.y, reachNow(), Math.PI, 0, true);
  ctx.stroke();
  ctx.restore();
  ctx.strokeStyle = "rgba(244, 236, 210, 0.35)";
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(origin.x, origin.y - 28);
  ctx.lineTo(land.x, land.y);
  ctx.stroke();
  var ring = rifle.blast ? rifle.blast : 6 + rifle.hit * 0.35;
  ctx.strokeStyle = land.len > reachNow() ? "#e07a4a" : rifle.color;
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.arc(land.x, land.y, ring, 0, Math.PI * 2);
  ctx.stroke();
  if (!rifle.blast) {
    ctx.beginPath();
    ctx.moveTo(land.x - ring - 6, land.y);
    ctx.lineTo(land.x - ring + 2, land.y);
    ctx.moveTo(land.x + ring - 2, land.y);
    ctx.lineTo(land.x + ring + 6, land.y);
    ctx.moveTo(land.x, land.y - ring - 6);
    ctx.lineTo(land.x, land.y - ring + 2);
    ctx.moveTo(land.x, land.y + ring - 2);
    ctx.lineTo(land.x, land.y + ring + 6);
    ctx.stroke();
  }
  ctx.fillStyle = rifle.color;
  ctx.lineWidth = rifle.damage;
  tracers.forEach(function (tr) {
    ctx.globalAlpha = Math.max(0, tr.t * (tr.lob ? 3 : 6));
    ctx.beginPath();
    ctx.moveTo(tr.x, tr.y);
    if (tr.lob) ctx.quadraticCurveTo((tr.x + tr.x2) / 2, Math.min(tr.y, tr.y2) - 70, tr.x2, tr.y2);
    else ctx.lineTo(tr.x2, tr.y2);
    ctx.stroke();
    ctx.globalAlpha = 1;
  });
  tracers = tracers.filter(function (tr) { tr.t -= 0.016; return tr.t > 0; });
  drawGun();
  flashes.forEach(function (f) {
    var flash = ctx.createRadialGradient(f.x, f.y, 1, f.x, f.y, f.r || 10);
    flash.addColorStop(0, "rgba(255,244,210,0.95)");
    flash.addColorStop(1, "rgba(255,160,40,0)");
    ctx.fillStyle = flash;
    ctx.beginPath();
    ctx.arc(f.x, f.y, (f.r || 10) * 1.6, 0, Math.PI * 2);
    ctx.fill();
  });
  flashes = flashes.filter(function (f) { f.t -= 0.016; return f.t > 0; });
  blasts.forEach(function (b) {
    var grow = 1.15 - b.t;
    ctx.fillStyle = "rgba(255, 170, 60, " + (b.t * 0.45) + ")";
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.r * grow, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = "rgba(90, 40, 16, " + b.t + ")";
    ctx.lineWidth = 3;
    ctx.stroke();
  });
  blasts = blasts.filter(function (b) { b.t -= 0.02; return b.t > 0; });
  if (rifle.scope) {
    ctx.fillStyle = "rgba(6, 8, 6, 0.55)";
    ctx.beginPath();
    ctx.rect(0, 0, 900, 520);
    ctx.arc(aimX, aimY, 90, 0, Math.PI * 2, true);
    ctx.fill();
    ctx.strokeStyle = "rgba(214,226,168,0.7)";
    ctx.strokeRect(aimX - 90, aimY - 90, 180, 180);
  }
  var secs = Math.max(0, Math.ceil(clock));
  var he = lang === "he";
  var lines = [
    t(place.id),
    t("clock") + " " + secs,
    t("kills") + " " + hits + "/8",
    t("score") + " " + score,
    t("stage") + " " + stage,
    t("range") + " " + reachNow()
  ].concat(streak > 1 ? [t("streak") + " " + streak] : []).concat(feed);
  var panelX = he ? 728 : 8;
  ctx.fillStyle = "rgba(12,16,10,0.62)";
  ctx.fillRect(panelX, 8, 164, 14 + lines.length * 15);
  ctx.font = "12px Segoe UI";
  ctx.textAlign = he ? "right" : "left";
  var textX = he ? 884 : 16;
  lines.forEach(function (line, i) {
    ctx.fillStyle = i === 0 ? "#f6edd4" : (i >= 5 ? "#f4e2a8" : "#d7e2c4");
    ctx.fillText(line, textX, 22 + i * 15);
  });
  hud.textContent = t(place.id) + "  " + t("stage") + " " + stage;
  gun.textContent = rifleName(rifle) + " · " + statLine(rifle) + " · " + t("breath") + " " + breath.toFixed(1) + " · " + labels.map(function (key) {
    return skillName(key) + " " + skills[key];
  }).join("  ");
  var barX = he ? 764 : 16;
  ctx.fillStyle = "#24301a";
  ctx.fillRect(barX, 500, 120, 6);
  ctx.fillStyle = breath >= stamCost(rifle) ? "#9dce78" : "#e07a4a";
  ctx.fillRect(barX, 500, 120 * (breath / breathMax()), 6);
  if (cool > 0) {
    var span = waitMs();
    ctx.strokeStyle = skills.cycle > 6 ? "#9dce78" : "#e7c56a";
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.arc(origin.x, origin.y - 18, 22, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * (1 - cool / span), false);
    ctx.stroke();
  }
  paintPlate();
}
var langBtn = document.getElementById("lang");
function applyLang() {
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === "he" ? "rtl" : "ltr";
  langBtn.textContent = lang === "he" ? "HE" : "EN";
  if (choosing) fillPick();
  syncTouchUi();
}
langBtn.onclick = function () {
  lang = lang === "he" ? "en" : "he";
  localStorage.setItem("burrow-sniper-lang", lang);
  applyLang();
};
applyLang();
requestAnimationFrame(frame);
</script>
</body>
</html>
